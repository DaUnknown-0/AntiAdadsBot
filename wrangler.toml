name = "discord-moderation-bot"
main = "src/index.ts"
# 2024-04-03 or later is required for Durable Object RPC (BanJob.start)
compatibility_date = "2025-12-01"

# Environment variables are set via wrangler secrets (use `npx wrangler secret put`)

# Run the Worker close to its backend (D1) instead of close to Discord when that is faster.
# Each slash command makes several sequential D1 round trips, so this can cut response time.
# Keep logs (console output, e.g. Discord rate limits) in the dashboard; included in the free plan
[observability]
enabled = true

[placement]
mode = "smart"

# Hourly global ban enforcement (replaces the external cron-job.org call, free on every plan)
[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "discord-moderation-db"
database_id = "3d75ce5f-5870-4141-b7ec-b019d03e31b5"  # Created by wrangler d1 create discord-moderation-db

[[kv_namespaces]]
binding = "CACHE"
id = "7015f5bb2436428db18e660fc8b3ea7b"
preview_id = "ceb53756d69a47ae9a3e952c3df04f15"

# Durable Objects bindings
# (no script_name: the classes live in this Worker, so every environment uses its own instances)
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[durable_objects.bindings]]
name = "BAN_JOBS"
class_name = "BanJob"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter", "ScheduledActions"]

# ScheduledActions was never used and would have stored the bot token in Durable Object storage
[[migrations]]
tag = "v2"
new_sqlite_classes = ["BanJob"]
deleted_classes = ["ScheduledActions"]

# For development
[env.dev]
name = "discord-moderation-bot-dev"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "discord-moderation-db-dev"
database_id = ""

[[env.dev.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[env.dev.durable_objects.bindings]]
name = "BAN_JOBS"
class_name = "BanJob"

# Dev KV namespace binding (create dev KV namespace and set id here):
# [[env.dev.kv_namespaces]]
# binding = "CACHE"
# id = "REPLACE_WITH_DEV_KV_ID"
